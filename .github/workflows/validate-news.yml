name: Validate news data

on:
  pull_request:
    paths:
      - "data/news.json"
      - "scripts/validate_news.py"
  push:
    branches: [main]
    paths:
      - "data/news.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_news.py
